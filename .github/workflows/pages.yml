name: Deploy museum to GitHub Pages

on:
  push:
    branches: [main, master, claude/serene-shannon-dxxst4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare photos (thumbnails, large versions, manifest)
        run: |
          pip install --quiet pillow pillow-heif
          python tools/build_photos.py
      - name: Stamp file versions so phones never keep an old copy
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#href=\"style.css\"#href=\"style.css?v=$V\"#; s#src=\"js/main.js\"#src=\"js/main.js?v=$V\"#" index.html
          sed -i -E "s#(from '\.{1,2}/[A-Za-z./_-]+\.js)'#\1?v=$V'#g" js/*.js
          grep -n "?v=" index.html js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
